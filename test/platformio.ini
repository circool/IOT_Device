
[env:test_esp32]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/DHT sensor library@^1.4.6
test_framework = unity
test_build_src = true
build_src_filter = 
    +<*>
    -<main.cpp>
    -<web.cpp>
    -<web.h>
    -<mqtt.cpp>
    -<mqtt.h>