; Ускорение platformio для быстрого переключения между платформами 
[settings]
; enable_cache = true


[common]
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = direct
build_flags =
  -DMONITOR_SPEED=115200
  -DDEVICE_TYPE=1
  -DSENSOR_TYPE=1
  -DVERSION=\"0.12.0\"
  -DMAGIC_VALUE=0x5A6D
  -DPB_ENABLE_MALLOC=0
  -DPB_FIELD_16BIT=1
  -DSCANNING_WIFI_ENABLED=0
build_src_filter = 
    +<*.cpp>
    -<deprecated/*.cpp>

; ================================================================
; 0. ESP 8266  — WIFI: AP/ MQTT || / && WEB
; ================================================================
[env:esp8266]
platform = espressif8266@~4.1.0
board = nodemcu
extends = common
upload_port = /dev/cu.usbserial-1420
monitor_port = /dev/cu.usbserial-1420
lib_deps = 
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit AHTX0 @ ^2.0.5
    ayushsharma82/ElegantOTA @ ^2.2.8
    adafruit/DHT sensor library@^1.4.6
build_flags =
  ${common.build_flags}
    -Wno-sign-compare
    -Wno-uninitialized
    -DTRANSPORT_TYPE=1           # 0-NONE, 1-WiFi, 2-ZIGBEE, 3-MATTER
    -DSWITCH_PIN=14
    -DPROVISIONING_METHOD=2      # 0=None, 1=BLE, 2=AP, 3 = AP+BLE
    -DFEATURE_BUTTON_ENABLED=0


; ================================================================
; 1. ESP32 — WIFI/AP/WIFI: MQTT
; ================================================================
[env:esp32-ap_only]
platform = espressif32@6.4.0
board = esp32dev
extends = common
lib_deps = 
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit AHTX0 @ ^2.0.5
    ayushsharma82/ElegantOTA @ ^2.2.5
    adafruit/DHT sensor library@^1.4.6

upload_port = /dev/cu.usbserial-1420
monitor_port = /dev/cu.usbserial-1420
build_flags =
  ${common.build_flags}
  -DTRANSPORT_TYPE=1           # 0-NONE, 1-WiFi, 2-ZIGBEE, 3-MATTER
  -DSWITCH_PIN=4
  -DLED_INVERTED=0
  -DSTATUS_LED_PIN=2
  -DPROVISIONING_METHOD=2      # 0=None, 1=BLE, 2=AP, 3 = AP+BLE
  

; ================================================================
; 2. ESP32 (BLE) — WIFI/BLE/MQTT
; ================================================================
[env:esp32-ble_only]
platform = espressif32@6.4.0
board = esp32dev
board_build.partitions = huge_app.csv # BLE тяжелая
extends = common
lib_deps = 
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit AHTX0 @ ^2.0.5
    ayushsharma82/ElegantOTA @ ^2.2.5
    adafruit/DHT sensor library@^1.4.6

upload_port = /dev/cu.usbserial-1420
monitor_port = /dev/cu.usbserial-1420
build_flags =
  ${common.build_flags}
  -DTRANSPORT_TYPE=1           # 0-NONE, 1-WiFi, 2-ZIGBEE, 3-MATTER
  -DSWITCH_PIN=4
  -DLED_INVERTED=0
  -DSTATUS_LED_PIN=2
  -DPROVISIONING_METHOD=1       # 0=None, 1=BLE, 2=AP, 3 = AP+BLE
  -DCORE_DEBUG_LEVEL=4          # только так будет показан список сетей в ESP BLE Prov!

[env:esp32-ble-ap]
platform = espressif32@6.4.0
board = esp32dev
board_build.partitions = huge_app.csv # BLE тяжелая
; board_build.partitions = default.csv
upload_port = /dev/cu.usbserial-1420
monitor_port = /dev/cu.usbserial-1420
extends = common
lib_deps = 
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit AHTX0 @ ^2.0.5
    ayushsharma82/ElegantOTA @ ^2.2.5
    adafruit/DHT sensor library@^1.4.6

build_flags =
  ${common.build_flags} 
  -DSWITCH_PIN=4
  -DLED_INVERTED=0
  -DSTATUS_LED_PIN=2
  -DTRANSPORT_TYPE=1            # 0-NONE, 1-WiFi, 2-ZIGBEE, 3-MATTER
  -DPROVISIONING_METHOD=3       # 0=None, 1=BLE, 2=AP, 3 = AP+BLE
  -DCORE_DEBUG_LEVEL=4          # только так будет показан список сетей в ESP BLE Prov!

; ================================================================
; 3. Модуль ESP32-C3 Super Mini 
; ================================================================
[env:esp32-c3-SuperMini]
platform = espressif32@6.4.0
board = esp32-c3-devkitm-1
board_build.partitions = huge_app.csv
upload_port = /dev/cu.usbmodem14201
monitor_port = /dev/cu.usbmodem14201
extends = common

lib_deps = 
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit AHTX0 @ ^2.0.5
    ayushsharma82/ElegantOTA @ ^2.2.5
    adafruit/DHT sensor library@^1.4.6
build_flags =
  ${common.build_flags}
  -DTRANSPORT_TYPE=1            # 0-NONE, 1-WiFi, 2-ZIGBEE, 3-MATTER
  -DSWITCH_PIN=4
  -DRESET_PIN=9                 # Кнопка BOOT на плате ESP32-C3 Super Mini
  -DSTATUS_LED_PIN=8            # Синий светодиод на плате ESP32-C3 Super Mini
  -DLED_INVERTED=1  
  -DI2C_SDA_PIN=4
  -DI2C_SCL_PIN=5
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DPROVISIONING_METHOD=3       # (у C3 есть BLE но он работает плохо и не работает одновременно с AP) // 0=None, 1=BLE, 2=AP 3=>Ошибка компиляции
  -DCORE_DEBUG_LEVEL=0
  -DFEATURE_WEB_ENABLED=1
  -DFEATURE_OTA_ENABLED=1


; ================================================================
; 4. Модуль ESP32-C6
; ================================================================
[env:esp32-c6-SuperMini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip # использовать альтернативную, неофициальную платформу
board = esp32-c6-devkitm-1

board_build.partitions = huge_app.csv
upload_port = /dev/cu.usbmodem14201
monitor_port = /dev/cu.usbmodem14201
extends = common

lib_deps = 
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit AHTX0 @ ^2.0.5
    ayushsharma82/ElegantOTA @ ^2.2.5
    adafruit/DHT sensor library@^1.4.6
build_flags =
  ${common.build_flags}
  -DTRANSPORT_TYPE=1            # 0-NONE, 1-WiFi, 2-ZIGBEE, 3-MATTER
  -DSWITCH_PIN=4
  -DRESET_PIN=9                 # Кнопка BOOT на плате ESP32-C6 Super Mini
  -DSTATUS_LED_PIN=15           # Синий светодиод на плате ESP32-C6 Super Mini
  -DLED_INVERTED=0              # Для ESP32-C6 Super Mini xлогика управления прямая
  -DI2C_SDA_PIN=4
  -DI2C_SCL_PIN=5
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DPROVISIONING_METHOD=1      # (у C6 есть BLE но он плохо (network_prov_mgr: Failed to start scan) работает одновременно с AP) // 0=None, 1=BLE, 2=AP 3=AP+BLE
  -DCORE_DEBUG_LEVEL=0
  -DFEATURE_OTA_ENABLED=0

 


