[common]
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = direct
build_flags =
  -DMONITOR_SPEED=115200
  -DDEVICE_TYPE=1
  -DVERSION=\"1.9.0\"
  -DMAGIC_VALUE=0x5A6D
  -DLOG_LEVEL=4
  -DLOG_CATEGORIES=0xFFFF
  -DLOG_USE_COLOR=1
  -DOTA_ENABLED=1
  -DPB_ENABLE_MALLOC=0
  -DPB_FIELD_16BIT=1
  -DBLE_PROVISIONING_PIN=\"abcd1234\"

; ================================================================
; 0. ESP 8266 (минимальный) — WIFI/AP/MQTT
; ================================================================
[env:esp8266]
platform = espressif8266@~4.1.0
board = nodemcu
extends = common
upload_port = /dev/cu.usbserial-1420
monitor_port = /dev/cu.usbserial-1420
lib_deps = 
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit AHTX0 @ ^2.0.5
    ayushsharma82/ElegantOTA @ ^2.2.8
    adafruit/DHT sensor library@^1.4.6
build_flags =
  ${common.build_flags}
    -Wno-sign-compare
    -Wno-uninitialized
    -DSWITCH_PIN=14
    -DPROVISIONING_METHOD=2      # ← AP

; ================================================================
; 1. ESP32 (классический) — ТОЛЬКО WIFI/AP/MQTT
; ================================================================
[env:esp32-mqtt]
platform = espressif32@6.4.0
board = esp32dev
extends = common
lib_deps = 
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit AHTX0 @ ^2.0.5
    ayushsharma82/ElegantOTA @ ^2.2.5
    adafruit/DHT sensor library@^1.4.6

upload_port = /dev/cu.usbserial-1420
monitor_port = /dev/cu.usbserial-1420
build_flags =
  ${common.build_flags}
  -DMQTT_ENABLED=1
  -DZIGBEE_ENABLED=0
  -DSWITCH_PIN=4
  -DLED_INVERTED=0
  -DSTATUS_LED_PIN=2
  -DWDT_ENABLED=1
  -DPROVISIONING_METHOD=2      # ← AP
  

; ================================================================
; 2. ESP32 (BLE) — WIFI/BLE/MQTT
; ================================================================
[env:esp32-ble]
platform = espressif32@6.4.0
board = esp32dev
board_build.partitions = huge_app.csv
extends = common
lib_deps = 
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit AHTX0 @ ^2.0.5
    ayushsharma82/ElegantOTA @ ^2.2.5
    adafruit/DHT sensor library@^1.4.6

upload_port = /dev/cu.usbserial-1420
monitor_port = /dev/cu.usbserial-1420
build_flags =
  ${common.build_flags}
  -DMQTT_ENABLED=1
  -DZIGBEE_ENABLED=0
  -DSWITCH_PIN=4
  -DLED_INVERTED=0
  -DSTATUS_LED_PIN=2
  -DWDT_ENABLED=1
  -DPROVISIONING_METHOD=1      # ← BLE 
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_BT_ENABLED=1
  -DCONFIG_BLUEDROID_ENABLED=0
  -DCONFIG_BT_BLUEDROID_ENABLED=0
  -DCONFIG_BT_NIMBLE_ENABLED=1
  
; ================================================================
; 3. ESP32-C3 — ТОЛЬКО MQTT (нет ZigBee)
; ================================================================
[env:esp32-c3-mqtt]
platform = espressif32@6.4.0
board = esp32-c3-devkitm-1
board_build.partitions = huge_app.csv
extends = common
upload_port = /dev/cu.usbmodem14201
monitor_port = /dev/cu.usbmodem14201
lib_deps = 
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit AHTX0 @ ^2.0.5
    ayushsharma82/ElegantOTA @ ^2.2.5
    adafruit/DHT sensor library@^1.4.6
build_flags =
  ${common.build_flags}
  -DMQTT_ENABLED=1
  -DZIGBEE_ENABLED=0
  -DSWITCH_PIN=4
  -DLED_INVERTED=1
  -DSTATUS_LED_PIN=8
  -DI2C_SDA_PIN=4
  -DI2C_SCL_PIN=5
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWDT_ENABLED=0
  -DPROVISIONING_METHOD=1      # (у C3 есть BLE) // 0=AUTO, 1=BLE, 2=AP

; ================================================================
; 4. ESP32-C6 — MQTT ИЛИ ZigBee (выбор пользователя)
; ================================================================

; 4a. ESP32-C6 с MQTT (использует WiFi)
[env:esp32-c6-mqtt]
platform = espressif32@6.4.0
board = esp32-c6-devkitm-1
framework = espidf
extends = common
build_unflags = ${common.build_flags}
upload_port = /dev/cu.usbmodem14201
monitor_port = /dev/cu.usbmodem14201
lib_deps = 
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit AHTX0 @ ^2.0.5
    ayushsharma82/ElegantOTA @ ^2.2.5
    adafruit/DHT sensor library@^1.4.6
build_flags =
  ${common.build_flags}
  -DMQTT_ENABLED=1
  -DZIGBEE_ENABLED=0
  -DSWITCH_PIN=4
  -DLED_INVERTED=1
  -DSTATUS_LED_PIN=8
  -DI2C_SDA_PIN=4
  -DI2C_SCL_PIN=5
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWDT_ENABLED=0
  -DPROVISIONING_METHOD=1      # ← BLE

; 4b. ESP32-C6 с ZigBee (НЕ использует WiFi)
[env:esp32-c6-zigbee]
platform = espressif32@6.4.0
board = esp32-c6-devkitm-1
framework = espidf
extends = common
build_unflags = ${common.build_flags}
upload_port = /dev/cu.usbmodem14201
monitor_port = /dev/cu.usbmodem14201
lib_deps = 
    # Для Zigbee нужны свои библиотеки (ESP-Zigbee-SDK)
build_flags =
  ${common.build_flags}
  -DMQTT_ENABLED=0
  -DZIGBEE_ENABLED=1
  -DSWITCH_PIN=4
  -DLED_INVERTED=1
  -DSTATUS_LED_PIN=8
  -DI2C_SDA_PIN=4
  -DI2C_SCL_PIN=5
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWDT_ENABLED=0
  -DPROVISIONING_METHOD=1      # ← BLE