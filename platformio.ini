[common]
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = direct
build_flags =
; Common sets
    -DMAGIC_VALUE=0x5A6B
    -DDEVICE_TYPE=1
    -DVERSION=\"1.7.1\"
    -DSTATUS_LED_PIN=2
; Debugging
    -DDEBUG_ENABLED=1
    ;-DCORE_DEBUG_LEVEL=5
    ; Device class testing
    ; -DUSE_DEVICE_CLASS=0
    ; -DDEBUG_DEVICE_CLASS=1
    ; -DIGNORE_DEVICE_CRC=0
    ; -DTEST_DEVICE_WIFI=1
    ; -DTEST_DEVICE_MQTT=1
    ; -DTEST_DEVICE_SENSOR=1
    ; -DTEST_DEVICE_FAN=1
    ; -DTEST_DEVICE_WEB=1
    ; -DTEST_DEVICE_FULL=1
; Detailed debugging for modules 
    ;-DDEBUG_WIFI_ENABLED=1
    ;-DDEBUG_OTA=1
    ;-DSIMULATE_EEPROM_MALFUNCTION=1

; Logging debug parts disabling
    ; -DLOG_SENSOR=0
    ; -DLOG_CONFIG=0
    ; -DLOG_FAN=0
    ; -DLOG_ACTUATOR=0
    ; -DLOG_MQTT=0
    ; -DLOG_WIFI=0
    ; -DLOG_WEB=0
    ; -DLOG_AP=0
    ; -DLOG_OTA=0

; Device features disable
    ; -DOTA_ENABLED=0
    ; -DMQTT_ENABLED=0
    ; -DWDT_ENABLED=0
    ; -DWIFI_ENABLED=0

; MQTT features
    ; -DMQTT_RESET_ENABLED=1
    ; -DMQTT_PUBLISH_RSSI=0   

; WEB features
    ; -DWEB_RESET_ENABLED=1    

; WDT features
    ;-DWDT_TIMER_MS=1000
    ;-DMQTT_PUBLISH_RESET_REASON=1
    ;-DMQTT_IGNORE_PUBLISH_NORMAL_RESET_REASONS=0

[env:esp32]
platform = espressif32@5.2.0
board = esp32dev
extends = common
lib_deps = 
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit AHTX0 @ ^2.0.5
    ayushsharma82/ElegantOTA @ ^2.2.5
    adafruit/DHT sensor library@^1.4.6

build_flags =
    ${common.build_flags}
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=0 
    
    -DSWITCH_PIN=4   
    -DLED_INVERTED=0

[env:esp8266]
platform = espressif8266
board = nodemcu
extends = common
lib_deps = 
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit AHTX0 @ ^2.0.5
    ayushsharma82/ElegantOTA @ ^2.2.8
    adafruit/DHT sensor library@^1.4.6
build_flags = 
    ${common.build_flags}
    -Wno-sign-compare
    -Wno-uninitialized
    -DSWITCH_PIN=14   
    ;LED
    -DLED_INVERTED=1
    
 
      
board_build.flash_size = 4MB
board_build.flash_mode = dout

